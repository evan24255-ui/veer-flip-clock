<div id="clock" class="clock">
    <div class="clock-display">

        <div class="clock-group">
            <div class="digit" id="hour-tens">
                <div class="digit-top">
                    <span>0</span>
                </div>

                <div class="digit-bottom">
                    <span>0</span>
                </div>

                <div class="flip-front">
                    <span>0</span>
                </div>

                <div class="flip-back">
                    <span>0</span>
                </div>
            </div>
            <div class="digit" id="hour-ones">
                <div class="digit-top">
                    <span>0</span>
                </div>

                <div class="digit-bottom">
                    <span>0</span>
                </div>

                <div class="flip-front">
                    <span>0</span>
                </div>

                <div class="flip-back">
                    <span>0</span>
                </div>
            </div>
        </div>

        <div class="separator">:</div>

        <div class="clock-group">
            <div class="digit" id="minute-tens">
                <div class="digit-top">
                    <span>0</span>
                </div>

                <div class="digit-bottom">
                    <span>0</span>
                </div>

                <div class="flip-front">
                    <span>0</span>
                </div>

                <div class="flip-back">
                    <span>0</span>
                </div>
            </div>
            <div class="digit" id="minute-ones">
                <div class="digit-top">
                    <span>0</span>
                </div>

                <div class="digit-bottom">
                    <span>0</span>
                </div>

                <div class="flip-front">
                    <span>0</span>
                </div>

                <div class="flip-back">
                    <span>0</span>
                </div>
            </div>
        </div>

    </div>
</div>
